<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>竖屏布局体检 v2（列全部元素）</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #report { font: 12px/1.4 Consolas, monospace; white-space: pre; margin: 0; padding: 8px; }
  #stage { position: absolute; left: -4000px; top: 0; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<pre id="report">audit v2 running...</pre>
<div id="stage">
  <iframe id="frP" src="../index.html" width="390" height="844"></iframe>
  <iframe id="frL" src="../index.html" width="844" height="390"></iframe>
</div>
<script>
(function () {
  var out = [];
  function line(s) { out.push(s); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s; }

  /* 把一棵树里"真的有盒子"的元素列出来：display:contents 的容器本身没有盒子，
     但它的孩子是父级 flex 的项目 —— 直接递归下去，depth 用 '+' 表示"穿透"。 */
  function walk(el, win, depth, maxDepth, res) {
    if (depth > maxDepth) return;
    var kids = el.children;
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      var st = win.getComputedStyle(k);
      if (st.display === 'none' || st.visibility === 'hidden') {
        res.push({ el: k, depth: depth, hidden: st.display });
        continue;
      }
      var b = k.getBoundingClientRect();
      var contents = (st.display === 'contents');
      if (!contents) {
        res.push({ el: k, depth: depth, rect: b, st: st });
      }
      walk(k, win, contents ? depth : depth + 1, maxDepth, res);
    }
  }

  function name(el) {
    var s = el.tagName.toLowerCase();
    if (el.id) s += '#' + el.id;
    if (el.className && typeof el.className === 'string') {
      s += '.' + el.className.trim().split(/\s+/).slice(0, 3).join('.');
    }
    return s;
  }

  function dumpScene(fr, sceneId, maxDepth) {
    var win = fr.contentWindow, doc = fr.contentDocument;
    var sc = doc.getElementById(sceneId);
    if (!sc) { line('  <没有 ' + sceneId + '>'); return; }
    var vh = win.innerHeight, vw = win.innerWidth;
    line('');
    line('--------------------------------------------------------------');
    line('【' + sceneId + '】视口 ' + vw + 'x' + vh +
         '  scrollH=' + sc.scrollHeight + ' clientH=' + sc.clientHeight +
         (sc.scrollHeight > sc.clientHeight + 1 ? '   超出 ' + (sc.scrollHeight - sc.clientHeight) + 'px' : '   一屏放得下'));
    var res = [];
    walk(sc, win, 1, maxDepth, res);
    var total = 0;
    for (var i = 0; i < res.length; i++) {
      var r = res[i];
      if (!r.rect) { line('  ' + pad('', (r.depth - 1) * 2) + name(r.el) + '   [display:none]'); continue; }
      var b = r.rect;
      var order = r.st ? r.st.order : '0';
      var flag = '';
      if (b.bottom > vh + 0.5) flag = '  << 折在屏幕下方 ' + r1(b.bottom - vh);
      if (b.width < 1 || b.height < 1) flag = '  << 尺寸为0';
      var tag = (order !== '0' && order !== 'normal') ? (' [order=' + order + ']') : '';
      line('  ' + pad('', (r.depth - 1) * 2) + pad(name(r.el), 34) +
           ' x=' + pad(r1(b.left), 7) + ' w=' + pad(r1(b.width), 7) +
           ' y=' + pad(r1(b.top), 7) + ' h=' + pad(r1(b.height), 7) + tag + flag);
    }
  }

  function metrics(fr) {
    var win = fr.contentWindow, doc = fr.contentDocument;
    var sc = doc.getElementById('scene-game');
    var st = win.getComputedStyle(sc);
    line('');
    line('scene-game: padding=' + st.paddingTop + '/' + st.paddingRight + '/' + st.paddingBottom + '/' + st.paddingLeft +
         '  display=' + st.display + '  gap=' + st.gap + '  overflowY=' + st.overflowY);
    var hud = doc.querySelector('.hud');
    line('hud: ' + (hud ? 'h=' + r1(hud.getBoundingClientRect().height) : '无'));
    var bw = doc.querySelector('.board-wrap'), g = doc.getElementById('player-half');
    if (bw && g) {
      var gs = win.getComputedStyle(g);
      line('board-wrap: w=' + r1(bw.getBoundingClientRect().width) +
           '   grid: w=' + r1(g.getBoundingClientRect().width) + ' h=' + r1(g.getBoundingClientRect().height) +
           '  gap=' + gs.gap + '  gridTemplate=' + gs.gridTemplateColumns);
      var cell = g.firstElementChild;
      if (cell) line('第一个格子: ' + r1(cell.getBoundingClientRect().width) + ' x ' + r1(cell.getBoundingClientRect().height));
    }
    var b = doc.getElementById('bench');
    if (b) {
      var bs = win.getComputedStyle(b);
      line('bench: w=' + r1(b.getBoundingClientRect().width) + ' gap=' + bs.gap + ' 模板=' + bs.gridTemplateColumns);
    }
    var r = doc.getElementById('shop-row');
    if (r) line('shop-row: w=' + r1(r.getBoundingClientRect().width) + ' gap=' + win.getComputedStyle(r).gap);
  }

  var done = 0;
  function finish() {
    document.getElementById('report').textContent = out.join('\n') + '\n###VERDICT### AUDIT DONE\n';
  }

  function auditOne(id, sceneId, maxDepth, metricsToo) {
    var fr = document.getElementById(id);
    fr.onload = function () {
      setTimeout(function () {
        try {
          var fr2 = fr, win = fr.contentWindow, doc = fr.contentDocument;
          line('');
          line('==============================================================');
          line('===== ' + (win.innerWidth > win.innerHeight ? '横屏' : '竖屏') + ' ' + win.innerWidth + 'x' + win.innerHeight + ' =====');
          dumpScene(fr, 'scene-cover', maxDepth);
          try { doc.getElementById('btn-pve').click(); } catch (e) { line('点开始异常 ' + e.message); }
          setTimeout(function () {
            try {
              if (metricsToo) metrics(fr);
              dumpScene(fr, 'scene-game', maxDepth);
            } catch (e) { line('异常: ' + e.message); }
            done++;
            if (done >= 2) finish();
          }, 400);
        } catch (e) { line('异常: ' + e.message); done++; if (done >= 2) finish(); }
      }, 500);
    };
  }

  auditOne('frP', 'scene-game', 3, true);
  auditOne('frL', 'scene-game', 2, false);
})();
</script>
</body>
</html>
