<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>背景 / 卡面 / 文字透明度 终检</title>
<style>html,body{margin:0;background:#fff}#report{font:12px/1.4 Consolas,monospace;white-space:pre;padding:8px}#stage{position:absolute;left:-4000px}</style>
</head>
<body>
<pre id="report">running...</pre>
<div id="stage"><iframe id="fr" src="../index.html" width="390" height="844"></iframe></div>
<script>
(function () {
  var out = [];
  function L(s) { out.push(s); }
  document.getElementById('fr').onload = function () {
    setTimeout(function () {
      var fr = document.getElementById('fr'), win = fr.contentWindow, doc = fr.contentDocument;
      try { doc.getElementById('btn-pve').click(); } catch (e) {}
      setTimeout(function () {
        try {
          var de = doc.documentElement, cs = win.getComputedStyle(de);
          L('=== ① 背景 ===');
          L('  body background-image : ' + win.getComputedStyle(doc.body).backgroundImage);
          L('  body background-color : ' + win.getComputedStyle(doc.body).backgroundColor);
          L('  山脊 SVG (valley-svg)  : display=' + win.getComputedStyle(doc.querySelector('.valley-svg')).display);
          L('  光柱   (rays)          : display=' + win.getComputedStyle(doc.querySelector('.rays')).display);
          L('  雾带   (mist-band)     : display=' + win.getComputedStyle(doc.querySelector('.mist-band')).display);
          var fu = doc.querySelectorAll('.float-unit');
          L('  封面浮动立绘            : ' + fu.length + ' 个（display=' + (fu[0] ? win.getComputedStyle(fu[0]).display : '?') + '）');
          L('  .scene 背景             : ' + win.getComputedStyle(doc.getElementById('scene-game')).backgroundImage.slice(0, 70));

          L('');
          L('=== ② 商店卡上的羁绊 ===');
          var card = doc.querySelector('.shop-card');
          if (card) {
            var em = card.querySelector('.st-em'), nm = card.querySelector('.st-nm');
            var tr = card.querySelector('.sc-traits');
            L('  emoji span  display=' + (em ? win.getComputedStyle(em).display : '无') +
              '  文字="' + (em ? em.textContent : '') + '"');
            L('  名字 span   display=' + (nm ? win.getComputedStyle(nm).display : '无') +
              '  文字="' + (nm ? nm.textContent : '') + '"   ← 手机上应为 none');
            L('  羁绊那一行  ' + Math.round(tr.getBoundingClientRect().width) + 'x' + Math.round(tr.getBoundingClientRect().height) +
              '  高度 ' + Math.round(tr.getBoundingClientRect().height) + 'px（只 emoji 时应该只有一行 ≈12px）');
          }

          L('');
          L('=== ③ 卡片醒目程度 ===');
          if (card) {
            var c2 = win.getComputedStyle(card);
            L('  边框 ' + c2.borderTopWidth + ' / 颜色 ' + c2.borderTopColor + ' ／ 圆角 ' + c2.borderTopLeftRadius);
            L('  投影 ' + c2.boxShadow.slice(0, 80));
          }

          L('');
          L('=== ④ 文字透明度 ===');
          ['--ink', '--ink-2', '--ink-3', '--ink-4'].forEach(function (k) {
            L('  ' + k.padEnd(9) + ' = ' + cs.getPropertyValue(k).trim());
          });
          var t1 = doc.querySelector('.shop-title');
          L('  .shop-title 实际 color = ' + win.getComputedStyle(t1).color);
        } catch (e) { L('异常 ' + e.message); }
        document.getElementById('report').textContent = out.join('\n') + '\n###VERDICT### AUDIT DONE\n';
      }, 700);
    }, 500);
  };
})();
</script>
</body>
</html>
