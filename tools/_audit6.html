<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>性能与细节终检 v6</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #report { font: 12px/1.4 Consolas, monospace; white-space: pre; margin: 0; padding: 8px; }
  #stage { position: absolute; left: -4000px; top: 0; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<pre id="report">running...</pre>
<div id="stage"><iframe id="fr" src="../index.html" width="390" height="844"></iframe></div>
<script>
(function () {
  var out = [];
  function L(s) { out.push(s); }
  function r(v) { return Math.round(v * 10) / 10; }

  var fr = document.getElementById('fr');
  fr.onload = function () {
    setTimeout(function () {
      var win = fr.contentWindow, doc = fr.contentDocument;
      try { doc.getElementById('btn-pve').click(); } catch (e) {}
      setTimeout(function () {
        try {
          /* ---------- ① 昂贵的 CSS 效果还剩多少 ---------- */
          L('=== ① 会掉帧的 CSS 效果（手机上） ===');
          var nFilter = 0, filtered = [], nBack = 0, backed = [], nAnim = 0, animated = [];
          var all = doc.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var el = all[i], st = win.getComputedStyle(el);
            if (st.display === 'none' || st.visibility === 'hidden') continue;
            var f = st.filter || 'none', bf = st.backdropFilter || st.webkitBackdropFilter || 'none';
            if (f !== 'none') { nFilter++; if (filtered.length < 8) filtered.push(el.className || el.tagName); }
            if (bf !== 'none') { nBack++; if (backed.length < 8) backed.push(el.className || el.tagName); }
          }
          if (el_animations_supported()) {
            var an = doc.getAnimations ? doc.getAnimations() : [];
            for (var j = 0; j < an.length; j++) {
              var it = an[j].effect && an[j].effect.getComputedTiming ? an[j].effect.getComputedTiming() : null;
              if (it && it.iterations === Infinity) { nAnim++; if (animated.length < 8) animated.push((an[j].animationName || an[j].effect.target.className || '?')); }
            }
          }
          L('  带 filter 的元素：' + nFilter + (nFilter ? '  → ' + filtered.join(', ') : '（全屏 blur 已经拿掉了）'));
          L('  带 backdrop-filter 的元素：' + nBack + (nBack ? '  ★ ' + backed.join(', ') : '  OK 一个都没有'));
          L('  无限循环动画：' + nAnim + (nAnim ? '  → ' + animated.join(', ') : '  OK 一个都没有'));
          L('  body 上的 filter：' + win.getComputedStyle(doc.body).filter + '（应为 none）');

          /* ---------- ② 羁绊小条：词条有没有被裁 ---------- */
          L('');
          L('=== ② 羁绊小条 ===');
          var tm = doc.getElementById('trait-mini');
          if (tm) {
            var chips = tm.querySelectorAll('.tm-chip');
            L('  条宽=' + tm.clientWidth + ' 内容宽=' + tm.scrollWidth + ' 内边距=' + win.getComputedStyle(tm).paddingLeft +
              (tm.scrollWidth > tm.clientWidth + 1 ? '  ★ 溢出被裁' : '  OK 装得下'));
            for (var k = 0; k < chips.length; k++) {
              L('    chip "' + chips[k].textContent.trim() + '" 宽=' + chips[k].offsetWidth + ' title="' +
                (chips[k].title || '').slice(0, 28) + '"');
            }
          }

          /* ---------- ③ 商店卡上的名字有没有被裁 ---------- */
          L('');
          L('=== ③ 商店卡上的名字 ===');
          var cards = doc.querySelectorAll('.shop-card');
          for (var m = 0; m < cards.length; m++) {
            var nmEl = cards[m].querySelector('.sc-name');
            if (!nmEl) continue;
            var range = doc.createRange(); range.selectNodeContents(nmEl);
            var tw = range.getBoundingClientRect().width, th = range.getBoundingClientRect().height;
            var cb = cards[m].getBoundingClientRect();
            var nb = nmEl.getBoundingClientRect();
            var clipped = nb.bottom > cb.bottom + 0.5 || nb.top < cb.top - 0.5 || nb.right > cb.right + 0.5 || nb.left < cb.left - 0.5;
            L('  "' + nmEl.textContent.trim() + '" 文字 ' + r(tw) + 'x' + r(th) + ' 容器宽=' + r(nb.width) +
              ' 字号=' + win.getComputedStyle(nmEl).fontSize + (clipped ? '  ★ 超出卡片' : '  OK'));
          }

          /* ---------- ④ 棋盘卡牌会不会互相压住（--gap 够不够） ---------- */
          L('');
          L('=== ④ 棋盘格与卡牌 ===');
          var cell = doc.querySelector('#player-half .cell');
          var gap = win.getComputedStyle(doc.getElementById('player-half')).gap;
          L('  格子=' + (cell ? cell.offsetWidth : '?') + ' 间距--gap=' + gap +
            '  卡牌宽=格子+6 → 每边溢出 3px，需要 gap ≥ 6 才不重叠 → ' +
            (parseFloat(gap) >= 6 ? 'OK' : '★ 会重叠'));

          /* ---------- ⑤ 全屏覆盖层 ---------- */
          L('');
          L('=== ⑤ 有没有东西盖在界面上 ===');
          var modal = doc.getElementById('modal-wrap');
          L('  模态框：' + (modal ? '★ 存在（' + modal.className + '）' : 'OK 没有'));
          var veils = doc.querySelectorAll('#veil');
          L('  遮罩 #veil：' + (veils.length ? win.getComputedStyle(veils[0]).visibility : '无'));
        } catch (e) { L('异常 ' + e.message + '\n' + e.stack); }
        document.getElementById('report').textContent = out.join('\n') + '\n###VERDICT### AUDIT DONE\n';
      }, 900);
    }, 500);
    function el_animations_supported() { return !!(fr.contentDocument.getAnimations); }
  };
})();
</script>
</body>
</html>
